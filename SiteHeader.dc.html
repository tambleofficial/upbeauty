<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./ub-motion.js"></script>
</helmet>
<header style="position:sticky;top:0;z-index:60;background:#FCFAF8;border-bottom:1px solid #EFE7E3;font-family:Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <div style="max-width:1440px;margin:0 auto;padding:16px clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;gap:24px;box-sizing:border-box">
    <a href="Home.dc.html" aria-label="UP BEAUTY 홈" style="display:flex;align-items:center"><img src="./assets/logo-dark.png" alt="UP BEAUTY 업뷰티" style="height:34px;width:auto;display:block"></a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:clamp(20px,3vw,44px)">
        <sc-for list="{{ menu }}" as="m" hint-placeholder-count="5">
          <a href="{{ m.href }}" style="display:flex;align-items:baseline;gap:7px;font-size:13.5px;letter-spacing:0.22em;font-weight:500;color:{{ m.color }};white-space:nowrap;padding:6px 0;border-bottom:1px solid {{ m.border }}" style-hover="color:#C98783">
            <span style="font-family:'Cormorant Garamond', serif;font-size:14.5px;letter-spacing:0;color:#D9A09A">{{ m.no }}</span>{{ m.label }}
          </a>
        </sc-for>
      </nav>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggle }}" aria-label="메뉴" style="width:44px;height:44px;border:0;background:transparent;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:7px;cursor:pointer;padding:0">
        <span style="display:block;width:26px;height:1px;background:#252220"></span>
        <span style="display:block;width:18px;height:1px;background:#252220"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:80;background:#FCFAF8;display:flex;flex-direction:column;padding:20px 24px 40px;box-sizing:border-box">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <img src="./assets/logo-dark.png" alt="UP BEAUTY" style="height:30px;width:auto">
        <button onClick="{{ toggle }}" aria-label="닫기" style="width:44px;height:44px;border:0;background:transparent;font-size:28px;font-weight:200;color:#252220;cursor:pointer">×</button>
      </div>
      <nav style="display:flex;flex-direction:column;margin-top:48px">
        <sc-for list="{{ menu }}" as="m" hint-placeholder-count="5">
          <a href="{{ m.href }}" style="display:flex;align-items:baseline;gap:16px;padding:20px 0;border-bottom:1px solid #E5DCD8;font-family:'Cormorant Garamond', serif;font-size:34px;font-weight:300;color:#252220">
            <span style="font-size:16.5px;color:#D9A09A">{{ m.no }}</span>{{ m.label }}
          </a>
        </sc-for>
      </nav>
      <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:#8D8380;letter-spacing:0.04em">
        <a href="tel:010-4953-2393" style="color:#3B302E">010-4953-2393</a>
        <a href="https://instagram.com/upbeauty_love" target="_blank" style="color:#3B302E">@upbeauty_love</a>
      </div>
    </div>
  </sc-if>
</header>

<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
  <div data-float-in style="position:fixed;right:clamp(16px,1.8vw,32px);bottom:clamp(20px,3vw,40px);z-index:55;display:flex;flex-direction:column;align-items:center;gap:14px;font-family:Pretendard, sans-serif">
    <a href="http://pf.kakao.com/_xlPgfn/chat" target="_blank" aria-label="카카오톡 상담" style="position:relative;width:112px;height:112px;display:flex;align-items:center;justify-content:center;color:#191919" style-hover="color:#191919">
      <svg data-spin viewBox="0 0 112 112" width="112" height="112" style="position:absolute;inset:0;overflow:visible"><defs><path id="ubCirc" d="M56,56 m-47,0 a47,47 0 1,1 94,0 a47,47 0 1,1 -94,0"></path></defs><text style="font-family:Pretendard, sans-serif;font-size:10.5px;letter-spacing:3.2px;font-weight:600" fill="#C98783"><textPath href="#ubCirc" textLength="292" lengthAdjust="spacing">KAKAO TALK · 1:1 CONSULT · </textPath></text></svg>
      <span data-pulse style="position:absolute;width:72px;height:72px;border-radius:50%;background:#FEE500"></span>
      <span style="position:relative;width:72px;height:72px;border-radius:50%;background:#FEE500;box-shadow:0 12px 30px rgba(59,48,46,0.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .5s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.08)"><svg width="26" height="26" viewBox="0 0 24 24" fill="#191919"><path d="M12 4c-4.6 0-8.3 2.9-8.3 6.5 0 2.3 1.5 4.3 3.8 5.5l-.8 3.3c-.1.3.3.5.5.3l3.9-2.6c.3 0 .6.1.9.1 4.6 0 8.3-2.9 8.3-6.6S16.6 4 12 4z"></path></svg><span style="font-size:10.5px;font-weight:700;letter-spacing:0.02em">상담</span></span>
    </a>
    <div style="display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:999px;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);box-shadow:0 12px 30px rgba(59,48,46,0.16);border:1px solid #F1E2DD">
      <a href="tel:010-4953-2393" aria-label="전화 상담 010-4953-2393" data-tip style="position:relative;width:52px;height:52px;border-radius:50%;background:#D0857A;display:flex;align-items:center;justify-content:center;transition:transform .5s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.1)"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg><span style="position:absolute;right:calc(100% + 14px);top:50%;transform:translateY(-50%);padding:9px 14px;border-radius:999px;background:#252220;color:#FFFFFF;font-size:13px;font-weight:500;white-space:nowrap;pointer-events:none">010-4953-2393</span></a>
      <a href="https://instagram.com/upbeauty_love" target="_blank" aria-label="인스타그램" data-tip style="position:relative;width:52px;height:52px;border-radius:50%;background:linear-gradient(45deg,#F9CE34 0%,#EE2A7B 50%,#6228D7 100%);display:flex;align-items:center;justify-content:center;transition:transform .5s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.1)"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="5"></rect><circle cx="12" cy="12" r="3.6"></circle><circle cx="16.8" cy="7.2" r="0.8" fill="#FFFFFF" stroke="none"></circle></svg><span style="position:absolute;right:calc(100% + 14px);top:50%;transform:translateY(-50%);padding:9px 14px;border-radius:999px;background:#252220;color:#FFFFFF;font-size:13px;font-weight:500;white-space:nowrap;pointer-events:none">@upbeauty_love</span></a>
      <button onClick="{{ toTop }}" aria-label="맨 위로" style="width:52px;height:52px;border-radius:50%;border:1px solid #EFDCD6;background:#FFFFFF;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond', serif;font-size:13px;letter-spacing:0.1em;color:#3B302E;transition:background .4s" style-hover="background:#FBEEEA">TOP</button>
    </div>
  </div>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;left:12px;right:12px;bottom:12px;z-index:55;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:Pretendard, sans-serif">
    <a href="http://pf.kakao.com/_xlPgfn/chat" target="_blank" data-shine style="position:relative;overflow:hidden;height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;color:#191919;background:#FEE500;box-shadow:0 8px 22px rgba(59,48,46,0.18)"><svg width="20" height="20" viewBox="0 0 24 24" fill="#191919"><path d="M12 4c-4.6 0-8.3 2.9-8.3 6.5 0 2.3 1.5 4.3 3.8 5.5l-.8 3.3c-.1.3.3.5.5.3l3.9-2.6c.3 0 .6.1.9.1 4.6 0 8.3-2.9 8.3-6.6S16.6 4 12 4z"></path></svg>카톡 상담</a>
    <a href="tel:010-4953-2393" style="height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;color:#FFFFFF;background:#D0857A;box-shadow:0 8px 22px rgba(59,48,46,0.18)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>전화하기</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;ABOUT&quot;,&quot;PROGRAM&quot;,&quot;CASES&quot;,&quot;PRICE &amp; GUIDE&quot;,&quot;CONTACT&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1200, open: false };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const active = this.props.active || '';
    const items = [['01','ABOUT','About.dc.html'],['02','PROGRAM','Program.dc.html'],['03','CASES','Cases.dc.html'],['04','PRICE & GUIDE','Price-Guide.dc.html'],['05','CONTACT','Contact.dc.html']];
    const menu = items.map(([no,label,href]) => ({ no, label, href, color: label === active ? '#C98783' : '#252220', border: label === active ? '#D9A09A' : 'transparent' }));
    const desktop = this.state.w > 900;
    return { toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }), menu, desktop, mobile: !desktop, open: this.state.open, toggle: () => this.setState(s => ({ open: !s.open })) };
  }
}
</script>
</body>
</html>
