<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  pages = ['Home', 'About', 'Program', 'Cases', 'Price-Guide', 'Contact'];
  slugs = { Home: '', About: 'about', Program: 'program', Cases: 'cases', 'Price-Guide': 'price-guide', Contact: 'contact' };
  titles = { Home: 'UP BEAUTY 업뷰티 | 대구 대명동 퍼스널 입술·눈썹·헤어라인 반영구', About: 'ABOUT | UP BEAUTY 업뷰티', Program: 'PROGRAM | UP BEAUTY 업뷰티', Cases: 'CASES | UP BEAUTY 업뷰티', 'Price-Guide': 'PRICE & GUIDE | UP BEAUTY 업뷰티', Contact: 'CONTACT | UP BEAUTY 업뷰티' };
  state = { page: this.fromHash() };
  fromHash() { const seg = location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0].toLowerCase(); const bySlug = Object.keys(this.slugs).find(k => this.slugs[k] === seg); if (seg && bySlug) return bySlug; const h = decodeURIComponent((location.hash || '').slice(1)).split('/')[0]; return this.pages.includes(h) ? h : 'Home'; }
  meta(p) { document.title = this.titles[p]; const c = document.querySelector('link[rel=canonical]'); if (c) c.href = 'https://upbeauty.pages.dev/' + (this.slugs[p] ? this.slugs[p] + '/' : ''); }
  go(page, anchor) {
    const same = page === this.state.page;
    history.pushState(null, '', '/' + (this.slugs[page] ? this.slugs[page] + '/' : '') + (anchor ? '#' + anchor : '')); this.meta(page);
    this.setState({ page }, () => {
      const jump = () => { const el = anchor && document.getElementById(anchor); window.scrollTo({ top: el ? el.getBoundingClientRect().top + window.scrollY - 70 : 0, behavior: same && el ? 'smooth' : 'auto' }); };
      requestAnimationFrame(jump); setTimeout(jump, 400);
    });
  }
  componentDidMount() {
    this.onClick = e => {
      const a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
      const href = a.getAttribute('href') || '';
      const m = href.match(/^(?:\.\/)?([A-Za-z-]+)\.dc\.html(?:#(.*))?$/);
      if (m && this.pages.includes(m[1])) { e.preventDefault(); this.go(m[1], m[2]); return; }
      if (/^#[A-Za-z]/.test(href)) { const el = document.getElementById(href.slice(1)); if (el) { e.preventDefault(); window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' }); } }
    };
    this.meta(this.state.page);
    this.onPop = () => this.setState({ page: this.fromHash() }, () => { this.meta(this.state.page); window.scrollTo(0, 0); });
    document.addEventListener('click', this.onClick, true);
    window.addEventListener('popstate', this.onPop);
  }
  componentWillUnmount() { document.removeEventListener('click', this.onClick, true); window.removeEventListener('popstate', this.onPop); }
  renderVals() {
    const p = this.state.page;
    return { isHome: p === 'Home', isAbout: p === 'About', isProgram: p === 'Program', isCases: p === 'Cases', isPrice: p === 'Price-Guide', isContact: p === 'Contact' };
  }
}
</script>
